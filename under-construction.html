<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Sean Lloyd Harold Raquel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-green': '#0f0',
                        'cyber-black': '#050505',
                        'cyber-gray': '#1a1a1a',
                    },
                    fontFamily: {
                        mono: ['Courier New', 'Courier', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber-black text-neon-green font-mono flex flex-col items-center justify-center min-h-screen text-center p-6 relative overflow-hidden">

    <!-- Matrix Rain Background -->
    <canvas id="matrix-rain" class="fixed inset-0 pointer-events-none z-0 opacity-20"></canvas>

    <div class="relative z-10 max-w-2xl border border-neon-green/50 bg-cyber-black/80 backdrop-blur-sm p-12 shadow-[0_0_20px_rgba(0,255,0,0.2)]">
        <!-- Warning Icon -->
        <div class="text-6xl mb-6 animate-pulse">
            <i class="fas fa-hammer"></i>
        </div>

        <h1 class="text-4xl md:text-5xl font-bold mb-4 uppercase tracking-wider glitch-text">
            System Upgrade <br> In Progress
        </h1>
        
        <div class="h-[2px] w-32 bg-neon-green mx-auto my-6"></div>

        <p class="text-gray-300 text-lg mb-8 leading-relaxed">
            This module is currently being compiled. <br>
            Please check back later for the deployed version.
        </p>

        <a href="index.html" class="inline-block px-8 py-3 bg-neon-green text-black font-bold uppercase tracking-widest hover:bg-white hover:shadow-neon transition-all">
            <i class="fas fa-arrow-left mr-2"></i> Return to Base
        </a>
    </div>

    <script>
        // Matrix Rain Effect (Simplified)
        const canvas = document.getElementById('matrix-rain');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const columns = Math.floor(canvas.width / 20);
        const yPositions = Array(columns).fill(0);

        function matrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = '15pt monospace';
            yPositions.forEach((y, i) => {
                const text = String.fromCharCode(Math.random() * 128);
                const x = i * 20;
                ctx.fillText(text, x, y);
                if (y > 100 + Math.random() * 10000) yPositions[i] = 0;
                else yPositions[i] = y + 20;
            });
        }
        setInterval(matrix, 50);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
